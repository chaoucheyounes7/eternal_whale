<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eternal Whale</title>
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <h1>Eternal Whale</h1>
  <p>منتجات فاخرة بجودة مميزة</p>
<input
  type="text"
  id="search-input"
  placeholder="ابحث عن منتج..."
>
  <p id="no-results" style="display: none;">لا توجد منتجات مطابقة</p>
  <h2>منتجاتنا</h2>
  <p>عدد المنتجات في السلة: <span id="cart-count">0</span></p>
<section id="cart">
  <h2>سلة المشتريات</h2>
  <ul id="cart-items"></ul>
  <p>المجموع الكلي: <span id="cart-total">0</span></p>
</section>
  
  <div class="product">
    <img src="FB_IMG_1777303594552.jpg" alt="Casquette premium" class="product-image">
    <h3>Casquette premium</h3>
    <p>السعر: 350</p>
    <button data-product="Casquette premium" data-price="350">أضف إلى السلة</button>
  </div>

  <div class="product">
  <img src="953-1.png" alt="Sacoche Premium" class="product-image">
    <h3>Sacoche </h3>
    <p>السعر: 700</p>
    <button data-product="Sacoche " data-price="700">أضف إلى السلة</button>
  </div>

<div class="product">
  <img src="IMG20250128064400.jpg" alt="Portefeuille " class="product-image">
  <h3>Portefeuille </h3>
  <p>السعر: 500</p>
  <button data-product="Portefeuille " data-price="500">أضف إلى السلة</button>
</div>
<section id="contact">
  <h2>تأكيد الطلبية</h2>
  <p>أدخل معلوماتك لإتمام طلبك.</p>

  <form id="contact-form">
    <label for="name">الاسم الكامل:</label>
    <input type="text" id="name" placeholder="اكتب اسمك الكامل" required>

    <label for="phone">رقم الهاتف:</label>
    <input type="tel" id="phone" placeholder="مثال: 0550123456" required>

    <label for="wilaya">الولاية:</label>
    <input type="text" id="wilaya" placeholder="اكتب الولاية" required>

    <label for="municipality">البلدية:</label>
    <input type="text" id="municipality" placeholder="اكتب البلدية" required>

    <button type="submit">تأكيد الطلبية</button>
  </form>

  <p id="form-message"></p>
</section>

  

<script src="script.js?v=2"></script
</body>
</html>
