<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eternal Whale</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Eternal Whale</h1>
  <p>منتجات فاخرة بجودة مميزة</p>
<input
  type="text"
  id="search-input"
  placeholder="ابحث عن منتج..."
>
  <p id="no-results" style="display: none;">لا توجد منتجات مطابقة</p>
  <h2>منتجاتنا</h2>
  <p>عدد المنتجات في السلة: <span id="cart-count">0</span></p>
<section id="cart">
  <h2>سلة المشتريات</h2>
  <ul id="cart-items"></ul>
  <p>المجموع الكلي: <span id="cart-total">0</span></p>
</section>
  
  <div class="product">
    <img src="FB_IMG_1777303594552.jpg" alt="Casquette premium" class="product-image">
    <h3>Casquette premium</h3>
    <p>السعر: 350</p>
    <button data-product="Casquette premium" data-price="350">أضف إلى السلة</button>
  </div>

  <div class="product">
  <img src="953-1.png" alt="Sacoche Premium" class="product-image">
    <h3>Sacoche </h3>
    <p>السعر: 700</p>
    <button data-product="Sacoche " data-price="700">أضف إلى السلة</button>
  </div>

<div class="product">
  <img src="IMG20250128064400.jpg" alt="Portefeuille " class="product-image">
  <h3>Portefeuille </h3>
  <p>السعر: 500</p>
  <button data-product="Portefeuille " data-price="500">أضف إلى السلة</button>
</div>
  <section id="contact">
  <h2>تواصل معنا</h2>
  <p>أرسل لنا رسالتك وسنرد عليك قريبًا.</p>

  <form id="contact-form">
    <label for="name">الاسم:</label>
    <input type="text" id="name" placeholder="اكتب اسمك" required>

    <label for="email">البريد الإلكتروني:</label>
    <input type="email" id="email" placeholder="example@email.com" required>

    <label for="message">رسالتك:</label>
    <textarea id="message" rows="5" placeholder="اكتب رسالتك هنا" required></textarea>

    <button type="submit">إرسال الرسالة</button>
  </form>

  <p id="form-message"></p>
  </section>
  

  <script src="script.js"></script>
</body>
</html>
