<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eternal Whale</title>
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <h1>Eternal Whale</h1>
  <p>منتجات فاخرة بجودة مميزة</p>
<input
  type="text"
  id="search-input"
  placeholder="ابحث عن منتج..."
>
  <p id="no-results" style="display: none;">لا توجد منتجات مطابقة</p>
  <h2>منتجاتنا</h2>
  <p>عدد المنتجات في السلة: <span id="cart-count">0</span></p>
<section id="cart">
  <h2>سلة المشتريات</h2>
  <ul id="cart-items"></ul>
  <p>المجموع الكلي: <span id="cart-total">0</span></p>
</section>
  
  <div id="products-container"></div>
<section id="contact">
  <h2>تأكيد الطلبية</h2>
  <p>أدخل معلوماتك لإتمام طلبك.</p>

  <form id="contact-form">
    <label for="name">الاسم الكامل:</label>
    <input type="text" id="name" placeholder="اكتب اسمك الكامل" required>

    <label for="phone">رقم الهاتف:</label>
    <input type="tel" id="phone" placeholder="مثال: 0550123456" required>

    <label for="wilaya">الولاية:</label>
    <input type="text" id="wilaya" placeholder="اكتب الولاية" required>

    <label for="municipality">البلدية:</label>
    <input type="text" id="municipality" placeholder="اكتب البلدية" required>

<label for="quantity">كمية المنتج:</label>
<input type="number" id="quantity" min="1" value="1" required>

<label for="color">لون المنتج:</label>
<select id="color" required>
  <option value="">اختر اللون</option>
  <option value="أسود">أسود</option>
  <option value="أبيض">أبيض</option>
  <option value="بني">بني</option>
  <option value="أحمر">أحمر</option>
  <option value="أزرق">أزرق</option>
</select>

<button type="submit">تأكيد الطلبية</button>

  </form>

  <p id="form-message"></p>
</section>

  

<script src="script.js?v=3"></script>
</body>
</html>
