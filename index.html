<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eternal Whale</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

    <p>السعر: 350</p>
    <button data-product="Casquette Dior" data-price="350">أضف إلى السلة</button>
  </div>

  <div class="product">
    <h3>Sacoche Gucci</h3>
    <p>السعر: 700</p>
    <button data-product="Sacoche Gucci" data-price="700">أضف إلى السلة</button>
  </div>

  <div class="product">
    <h3>Portefeuille Dior</h3>
    <p>السعر: 500</p>
    <button data-product="Portefeuille Dior" data-price="500">أضف إلى السلة</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
